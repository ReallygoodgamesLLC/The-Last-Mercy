# The Last Mercy: build the iOS app and send it to TestFlight (internal testers).
# Same setup as Witch's Greenhouse and Over the Fence: Capacitor + Codemagic, no Xcode on your machine.
workflows:
  the-last-mercy-ios:
    name: The Last Mercy iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Use the App Store Connect API key you already added to Codemagic for your other games.
      # Change this to that key's exact name in Codemagic (Team settings > Integrations > Developer Portal).
      app_store_connect: Sandkeep ASC Key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.reallygoodgame.thelastmercy
      vars:
        BUNDLE_ID: com.reallygoodgame.thelastmercy
        # The app's Apple ID: App Store Connect > your app > App Information > General Information > Apple ID
        APP_STORE_APPLE_ID: 0000000000
      node: 22
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Install packages
        script: npm ci
      - name: Create the iOS project
        script: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios
      - name: App icon, landscape only, full screen
        script: |
          ICON_DIR=ios/App/App/Assets.xcassets/AppIcon.appiconset
          for f in "$ICON_DIR"/*.png; do cp resources/icon-1024.png "$f"; done
          PL=ios/App/App/Info.plist
          PB=/usr/libexec/PlistBuddy
          for key in UISupportedInterfaceOrientations "UISupportedInterfaceOrientations~ipad"; do
            $PB -c "Delete :$key" "$PL" 2>/dev/null || true
            $PB -c "Add :$key array" "$PL"
            $PB -c "Add :$key:0 string UIInterfaceOrientationLandscapeLeft" "$PL"
            $PB -c "Add :$key:1 string UIInterfaceOrientationLandscapeRight" "$PL"
          done
          setp(){ $PB -c "Delete :$1" "$PL" 2>/dev/null || true; $PB -c "Add :$1 $2 $3" "$PL"; }
          setp UIRequiresFullScreen bool true
          setp UIStatusBarHidden bool true
          setp UIViewControllerBasedStatusBarAppearance bool false
          setp ITSAppUsesNonExemptEncryption bool false
          setp CFBundleDisplayName string "The Last Mercy"
          setp LSApplicationCategoryType string public.app-category.adventure-games
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Increase the build number
        script: |
          # Every upload needs a build number App Store Connect hasn't seen before.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          case "$LATEST" in ''|*[!0-9]*) LATEST=0;; esac
          NEXT=$((LATEST + 1))
          # Codemagic's own build counter always goes up, so use it if it's higher.
          if [ "${BUILD_NUMBER:-0}" -gt "$NEXT" ]; then NEXT=$BUILD_NUMBER; fi
          echo "Latest TestFlight build: $LATEST. Using build number $NEXT."
          cd ios/App && agvtool new-version -all "$NEXT"
      - name: Build the app
        script: |
          if [ -d ios/App/App.xcworkspace ]; then
            xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
          else
            xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
          fi
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
